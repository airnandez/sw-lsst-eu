build:
  # Run 'sphinx' on the document source and generate the static web site.
  stage: build
  image:
    name: sphinxdoc/sphinx:8.2.3
    entrypoint: [""]
  script:
    # Update the base image. Install and run 'sphinx' to build the documentation web site. 
    # On success, results are stored under 'docs/_build/'.
    - apt-get update --quiet=2
    - pip install sphinx-rtd-theme
    - sphinx-build --write-all --fresh-env --builder html docs/source docs/_build
  artifacts:
    paths:
        - docs/_build/

deploy:
  # Deploy to Gitlab Pages only if we are building the default branch.
  # The deployed site is accessible at: https://rubin-lsst.pages.in2p3.fr/sw.lsst.eu
  stage: deploy
  script:
    - mkdir -p public
    - cp --recursive docs/_build/. public/
  pages: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
